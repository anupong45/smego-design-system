name: verify

# ═══════════════════════════════════════════════════════════════════════════
# ชุดตรวจของ SME.GO Design System
# ───────────────────────────────────────────────────────────────────────────
# ★★★ CI รัน `npm run verify` **ทั้งก้อน** ไม่ไล่เรียกเกตทีละตัว
#
# ⚠️ ฉบับก่อนของไฟล์นี้ไล่เรียกเอง 5 ขั้น (`node 02-tokens/lint-classes.mjs` ·
#    typecheck · validate-tokens · test · test:e2e) แล้ว **ไม่ถูกอัปเดตอีกเลย**
#    ตั้งแต่ commit baseline 2026-07-28
#
#    ผลคือเกตที่สร้างขึ้นหลังจากนั้น **ไม่อยู่ใน CI เลยทั้งหมด**:
#      lint:quality · lint:parity · lint:docs · lint:api-comments ·
#      gallery:build · check:bundle
#    → CI เขียวโดยตรวจแค่ครึ่งเดียวของสิ่งที่ verify ตรวจ
#
#    การเรียกเกตทีละตัวในสองที่ (package.json + workflow นี้) **คือกลไก**
#    ที่ทำให้สองที่หลุดจากกัน · ตอนนี้มีแหล่งความจริงเดียวคือ `npm run verify`
#    เพิ่มเกตใหม่ใน package.json แล้ว CI ได้ไปด้วยเอง
#
# ⚠️ `tailwindcss` ต้องติดตั้งที่ **root ของ repo** ไม่ใช่ใน 03-components
#    เพราะ `02-tokens/theme.css` มี `@import "tailwindcss"` และ node
#    resolve จากไฟล์ที่ import จึงไล่ขึ้นจาก 02-tokens/ ซึ่งไม่เจอ
#    node_modules ของ 03-components เลย
#
# ⚠️ ต้องติดตั้ง Chromium **ก่อน** verify เพราะ test:e2e อยู่ข้างใน verify
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# ยกเลิก run เก่าของ branch เดียวกันเมื่อ push ใหม่
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03-components/package-lock.json

      # ─── dependencies ───────────────────────────────────────────────────
      - name: ติดตั้ง dependencies ของ 03-components
        working-directory: 03-components
        run: npm ci

      - name: ติดตั้ง tailwindcss ที่ root (ให้ 02-tokens/theme.css resolve ได้)
        run: npm i -D tailwindcss@^4 --no-save

      - name: ติดตั้ง Chromium ของ Playwright
        working-directory: 03-components
        run: npx playwright install --with-deps chromium

      # ─── ชุดตรวจทั้งก้อน ────────────────────────────────────────────────
      # ★★★ **ห้ามไล่รายชื่อเกตที่นี่** — รายชื่ออยู่ที่ `package.json` ที่เดียว
      #
      # ⚠️ คอมเมนต์เดิมตรงนี้ไล่รายชื่อเกตไว้ แล้ว **ค้าง** ภายในสองวัน:
      #    ไม่มี `rsc` · `check:fonts` · `build` · `check:dist` ที่เพิ่มหลังจากนั้น
      #    ไฟล์นี้เตือนเรื่องการเขียนรายการไว้สองที่ในหัวไฟล์ของตัวเอง
      #    แล้วก็ค้างด้วยเรื่องเดียวกัน — คราวนี้จึงไม่เขียนรายชื่ออีกเลย
      #
      # ★ ตัว script เรียงจากถูกไปแพงอยู่แล้ว จึงไม่ต้องแยกขั้นที่นี่
      #   และการแยกขั้นคือสิ่งที่ทำให้ CI หลุดจาก verify มาก่อน
      - name: npm run verify
        working-directory: 03-components
        run: npm run verify

      - name: เก็บผลเมื่อ e2e ล้ม
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            03-components/playwright-report/
            03-components/test-results/
          retention-days: 7
          if-no-files-found: ignore

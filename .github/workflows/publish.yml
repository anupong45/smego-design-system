name: publish

# ═══════════════════════════════════════════════════════════════════════════
# publish @smego/ui เมื่อมี tag `v*`
# ───────────────────────────────────────────────────────────────────────────
# ═══ ทำไม npm public ไม่ใช่ GitHub Packages (ตัดสิน 2026-07-30) ═══
#
# คำตัดสินตอน grill คือ "private registry" โดยยืนอยู่บนสมมติฐานว่ารีโปเป็น
# private · **repo เปลี่ยนเป็น public แล้ว** เหตุผลนั้นจึงหมดไป และเหลือข้อ
# เปรียบเทียบที่ชัดสองข้อ:
#
#   · **GitHub Packages ต้องมีโทเคนแม้ติดตั้งแพ็กเกจ public** ⇒ รีโปแอปต้องมี
#     `.npmrc` + secret ทุกที่ที่ `npm ci` รัน (เครื่องนักพัฒนา · CI · โฮสต์)
#     ลืมที่เดียว build ตายโดย error ที่ชี้ผิดทาง
#   · **GitHub Packages บังคับ scope = ชื่อเจ้าของ repo** ⇒ `@smego/ui` ใช้ไม่ได้
#     บน `anupong45` ต้อง rename เป็น `@anupong45/ui` หรือสร้าง org ชื่อ smego
#
# npm public: ติดตั้งได้โดยไม่ต้องมีโทเคน · เก็บชื่อ `@smego/ui` ได้ · ฟรี
# ตรวจแล้ว 2026-07-30: `@smego/ui` ยังไม่มีบน npm และ scope `@smego` มี 0 แพ็กเกจ
#
# ⚠️ ต้องทำครั้งเดียวก่อนใช้ workflow นี้:
#   1 สร้างบัญชี npm แล้วสร้าง org/scope `smego` (ฟรีสำหรับแพ็กเกจ public)
#   2 สร้าง **Granular access token** สิทธิ์ publish เฉพาะ scope นั้น
#   3 ใส่เป็น secret ชื่อ `NPM_TOKEN` ที่ repo → Settings → Secrets → Actions
#
# ผมไม่รับและไม่กรอกโทเคนแทน — ขั้นนี้ต้องเป็นเจ้าของบัญชีทำเอง
#
# ★★★ ปิดช่อง "หัก API แล้วลืมขยับเวอร์ชัน"
#
# `CHANGELOG.md` บันทึกไว้เองว่า 0.2.0 ค้างอยู่ที่ `0.1.0` หลายวันเพราะ
# **ไม่มีเกตไหนตรวจว่าการหัก API ต้องมาพร้อมการขยับเวอร์ชัน**
# ขั้น `ตรวจว่า tag ตรงกับ version` ปิดช่องนั้น: tag `v0.3.0` ต้องเจอ
# `"version": "0.3.0"` เท่านั้น
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    tags: ['v*', 'lint-v*']
  workflow_dispatch:

# npm public ไม่ต้องใช้ GITHUB_TOKEN เลย — สิทธิ์อ่านโค้ดพอ
permissions:
  contents: read

jobs:
  publish:
    # tag `lint-v*` ก็ขึ้นต้นด้วยตัวอักษร จึงไม่ชนกับ `v*` — แต่กันไว้ให้ชัด
    if: "!startsWith(github.ref_name, 'lint-v')"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03-components/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # ─── ตรวจก่อนทำอะไรที่ย้อนไม่ได้ ────────────────────────────────────
      # npm unpublish ทำได้ในกรอบเวลาแคบเท่านั้น · เวอร์ชันที่ปล่อยผิดจะอยู่ถาวร
      - name: ตรวจว่า tag ตรงกับ version ใน package.json
        working-directory: 03-components
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag คือ v$TAG แต่ package.json เป็น $PKG — ขยับเวอร์ชันให้ตรงก่อน tag"
            echo "ช่องนี้เคยทำให้ 0.2.0 ค้างอยู่ที่ 0.1.0 หลายวัน (ดู CHANGELOG.md)"
            exit 1
          fi
          echo "tag v$TAG ตรงกับ package.json"

      - name: ตรวจว่ามี NPM_TOKEN ก่อนเริ่มงานที่ใช้เวลา
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::ไม่มี secret NPM_TOKEN — ตั้งที่ Settings → Secrets → Actions"
            echo "ต้องเป็น Granular access token ที่มีสิทธิ์ publish ใน scope @smego"
            exit 1
          fi

      - name: ติดตั้ง dependencies
        working-directory: 03-components
        run: npm ci

      - name: ติดตั้ง tailwindcss ที่ root
        run: npm i -D tailwindcss@^4 --no-save

      - name: ติดตั้ง Chromium ของ Playwright
        working-directory: 03-components
        run: npx playwright install --with-deps chromium

      # ★ ห้าม publish ของที่ยังไม่ผ่านเกต — verify มี build + check:dist อยู่ในตัว
      #   `check:dist` คือตัวที่ยืนยันว่า `"use client"` รอดมาถึง dist ครบ
      #   ถ้าไม่มีมัน แอป Next จะตายตอน import โดยที่เกตอื่นเขียวทั้งหมด
      - name: npm run verify
        working-directory: 03-components
        run: npm run verify

      - name: แสดงสิ่งที่จะถูกส่งไปจริง (ก่อน publish)
        working-directory: 03-components
        run: npm pack --dry-run

      # `--access public` จำเป็นสำหรับ **แพ็กเกจ scoped ครั้งแรก** — ค่าปริยาย
      # ของ scoped package คือ restricted ซึ่งบัญชีฟรีทำไม่ได้ และจะตอบ 402
      - name: npm publish
        working-directory: 03-components
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ═════════════════════════════════════════════════════════════════════════
  # `@smego/lint` มีเวอร์ชันของตัวเอง จึงใช้ tag คนละชุด — `lint-v0.1.0`
  # ถ้าใช้ tag เดียวกัน สองแพ็กเกจจะถูกบังคับให้ขยับเวอร์ชันพร้อมกันตลอด
  # ทั้งที่ไม่มีเหตุผลให้ผูกกัน (ตัวหนึ่งเป็นไลบรารี UI ตัวหนึ่งเป็นเกต)
  # ═════════════════════════════════════════════════════════════════════════
  publish-lint:
    if: startsWith(github.ref_name, 'lint-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: ตรวจว่า tag ตรงกับ version
        working-directory: 02-tokens
        run: |
          TAG="${GITHUB_REF_NAME#lint-v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag lint-v$TAG ไม่ตรงกับ $PKG"; exit 1; }

      # ★ เกตต้องพิสูจน์ว่าทำงานก่อนถูกส่งไปให้ทีมอื่นใช้ —
      #   เกตที่ publish แล้วรันไม่ได้ทำให้ทีมแอปคิดว่าผ่าน ทั้งที่ไม่ได้ตรวจอะไร
      # linter อ่านไฟล์เฉย ๆ ไม่มี dependency — ไม่ต้อง npm ci ไม่ต้องมี tailwind
      - name: ทั้งสอง bin ต้องรันได้และ exit 0 บนโค้ดที่สะอาด
        run: |
          node 02-tokens/lint-classes.mjs
          node 02-tokens/lint-quality.mjs

      - name: npm publish
        working-directory: 02-tokens
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
